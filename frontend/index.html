<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>RVS-P</title>
<link rel="icon" href="data:,">

<link rel="preload" href="/static/ui/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/ui/css/tokens.css">
<link rel="stylesheet" href="/static/ui/css/base.css">
<link rel="stylesheet" href="/static/ui/css/shell.css">
<!-- 화면별 CSS -->
<link rel="stylesheet" href="/static/ui/css/overview.css">
<link rel="stylesheet" href="/static/ui/css/equipment.css">
<link rel="stylesheet" href="/static/ui/css/collect.css">
<link rel="stylesheet" href="/static/ui/css/train.css">
<link rel="stylesheet" href="/static/ui/css/inspect.css">
<link rel="stylesheet" href="/static/ui/css/diagnostics.css">
</head>
<body>

<!-- 비상 정지 — Vue 밖 정적 HTML. 문서에서 첫 번째 포커스 대상이라 Tab 한 번이면 닿고,
     화면에서는 상단바 오른쪽 끝에 fixed 로 떠 있다(shell.css). 확인창 없음. -->
<button type="button" class="rv-btn rv-btn--danger rv-estop" data-rvs-estop>
  <svg class="rv-btn__stop" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><rect x="1" y="1" width="10" height="10" rx="2"/></svg>비상 정지
</button>
<div id="rvs-estop-msg" class="rv-estop-msg" role="status" aria-live="assertive"></div>

<div id="app"><p class="rv-boot" id="rv-boot">화면을 불러오는 중입니다…</p></div>

<!-- 비상 정지 스크립트가 맨 처음이다. 아래 CDN 이 느리거나 막혀도 버튼은 이미 동작한다. -->
<script src="/static/ui/js/core/estop.js"></script>

<!-- 버전을 고정한다 — vue@3 처럼 열어 두면 CDN 이 새 버전을 내줄 때 검증 안 된 코드로 바뀐다(QA 는 3.5.44 로 했다) -->
<script src="https://unpkg.com/vue@3.5.44/dist/vue.global.prod.js"></script>
<script>
  if (!window.Vue) {
    document.getElementById('rv-boot').textContent =
      '화면 라이브러리(Vue, unpkg.com)를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요. 오른쪽 위 비상 정지 버튼은 지금도 동작합니다.';
  }
</script>
<!-- 검사 화면의 3D 뷰어용. 레거시 경로를 그대로 가리킨다(복사 금지) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/static/js/scan_viewer.js"></script>

<script src="/static/ui/js/core/api.js"></script>
<script src="/static/ui/js/core/format.js"></script>
<script src="/static/ui/js/core/store.js"></script>
<script src="/static/ui/js/core/ui.js"></script>

<!-- 화면: RVS.screens.<route> = { name, title, template, setup } -->
<script src="/static/ui/js/screens/overview.js"></script>
<script src="/static/ui/js/screens/equipment.js"></script>
<script src="/static/ui/js/screens/collect.js"></script>
<script src="/static/ui/js/screens/train.js"></script>
<script src="/static/ui/js/screens/inspect.js"></script>
<script src="/static/ui/js/screens/diagnostics.js"></script>

<script src="/static/ui/js/shell.js"></script>
<script src="/static/ui/js/app.js"></script>
</body>
</html>
