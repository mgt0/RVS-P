# ==============================================================
# OMX Scan Control 설정
# 실기 배포 전 반드시 arms.*.serial_number 와 cameras.*.device 를
# 실제 장비 값으로 채우세요. 비워두면 /dev 번호에 의존하게 되고,
# 재부팅 시 리더/팔로워가 뒤바뀔 수 있습니다.
# ==============================================================

server:
  host: 0.0.0.0
  port: 5000
  debug: false
  # 하드웨어 없이 UI/수집 파이프라인만 검증할 때 true.
  # 환경변수 OMX_SIMULATE=1 이 이 값을 덮어씁니다.
  simulate: false

arms:
  leader:
    model: OMX-L
    baudrate: 1000000
    # `udevadm info -a -n /dev/ttyACM0 | grep serial` 로 확인
    serial_number: null
    port_hint: COM10
    joint_ids: [1, 2, 3, 4, 5]
    home_position: [0.0, -90.0, 90.0, 0.0, 0.0]

  follower:
    model: OMX-F
    baudrate: 1000000
    serial_number: null 
    port_hint: COM7
    joint_ids: [11, 12, 13, 14, 15, 16]
    home_position: [0.0, -90.0, 90.0, 0.0, 0.0]

safety:
  # 1 tick(20ms) 당 허용 관절 변화량(deg).
  # 값을 키우면 반응이 빨라지지만 리더가 튈 때 팔로워도 함께 튑니다.
  max_relative_target: 5.0
  joint_limits:
    - [-180.0, 180.0]
    - [-120.0, 120.0]
    - [-120.0, 120.0]
    - [-180.0, 180.0]
    - [-100.0, 100.0]
  homing_speed_deg_per_s: 30.0
  watchdog_timeout_ms: 500

cameras:
  # device 는 /dev/v4l/by-id/... 경로를 권장합니다.
  # 정수 인덱스(0,1,2…)는 USB 열거 순서에 따라 바뀝니다.
  front: { device: 0, width: 640, height: 480, fps: 30, fourcc: MJPG }
  back:  { device: 1, width: 640, height: 480, fps: 30, fourcc: MJPG }
  left:  { device: 2, width: 640, height: 480, fps: 30, fourcc: MJPG }
  right: { device: 3, width: 640, height: 480, fps: 30, fourcc: MJPG }
  top:   { device: 4, width: 640, height: 480, fps: 30, fourcc: MJPG }
  global: { device: 5, width: 640, height: 480, fps: 30, fourcc: MJPG }

recording:
  root: ./lerobot_data
  sample_rate_hz: 30
  max_sync_skew_ms: 15.0
  jpeg_quality: 90
  classification_capture_at: 0.5
  queue_maxsize: 512
