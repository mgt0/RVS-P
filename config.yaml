# ==============================================================
# OMX Scan Control 설정
# 실기 배포 전 확인할 것:
#   arms.*        — serial_number(권장) 또는 port_hint. 비워두면 재부팅 시
#                   리더/팔로워가 뒤바뀔 수 있다.
#   cameras.*     — match_name + nth 로 장치 이름 매칭(인덱스는 USB 재연결에
#                   밀린다). 대응 확인: python scripts/find_cameras.py
#   conveyors.*   — 벨트별 COM 포트. 장치관리자에서 확인.
# ==============================================================

server:
  host: 0.0.0.0
  port: 5000
  # MJPEG 프리뷰만 받는 두 번째 포트. 브라우저는 '오리진당' 동시 연결이 6개인데
  # 카메라 6대 스트림이 연결을 하나씩 영구 점유해 그 예산을 다 써버리면, API 요청이
  # 큐에서 무한 대기한다 — 버튼을 눌러도 반응이 없고 잠긴 채 굳는다(실측 2026-08-14).
  # 포트가 다르면 오리진이 달라 연결 예산도 따로 잡힌다. 0 이면 분리하지 않는다.
  stream_port: 5001
  debug: false
  # 하드웨어 없이 UI/수집 파이프라인만 검증할 때 true.
  # 환경변수 OMX_SIMULATE=1 이 이 값을 덮어씁니다.
  simulate: false

arms:
  leader:
    model: OMX-L
    baudrate: 1000000
    # scripts/find_ports.py 로 확인 (2026-08-14 재확인 — serial_number 매칭이
    # 1순위라 포트가 COM6 이 아니게 바뀌어도 안전. port_hint 는 이 리그(3축 통합
    # 기준) 배선의 폴백값이다.
    serial_number: 976882E7503059384C2E3120FF07103B
    port_hint: COM6   # 관절 ID 1~6 확인됨 (6 = 그리퍼)
    # 리더는 teleop 중 항상 토크 OFF라(사람이 손으로 움직임) home_position 6번째
    # 값은 실기 구동에는 안 쓰이고 시뮬레이션 모드에서만 참조된다 — 임의값(0.0)이라도 안전하다.
    joint_ids: [1, 2, 3, 4, 5, 6]
    home_position: [0.0, -90.0, 90.0, 0.0, 0.0, 0.0]

  follower:
    model: OMX-F
    baudrate: 1000000
    # scripts/find_ports.py 로 확인 (2026-08-14 재확인)
    serial_number: 7646046C503059384C2E3120FF081821
    port_hint: COM7
    joint_ids: [11, 12, 13, 14, 15, 16]
    # 그리퍼(6번, ID 16) 홈 각도 실측 완료(3축 통합 작업에서 측정) — 이전엔
    # 5개뿐이라 go_home() 이 그리퍼를 안 움직였으나 지금은 안전 위치가 채워져 있다.
    #
    # 1번 관절(ID 11)이 180도인 이유: 0도로 두면 팔이 컨베이어 쪽을 향해 부딪힌다.
    # 반대쪽을 보고 시작하도록 홈 자세를 돌려놨다. joint_limits 1번이 ±180 이라
    # 180 은 경계값이지만 clamp 가 min/max 로 처리하므로 그대로 통과한다.
    # 주의: 홈 복귀를 누르면 이 자세까지 30°/s 로 움직인다(0→180 이면 6초).
    # 경로에 사람이나 물건이 없는지 보고 누를 것.
    home_position: [180.0, -90.0, 90.0, 0.0, 0.0, 0.0]

safety:
  # 1 tick(20ms) 당 허용 관절 변화량(deg).
  # 값을 키우면 반응이 빨라지지만 리더가 튈 때 팔로워도 함께 튑니다.
  max_relative_target: 5.0
  # 그리퍼(6번째) 리밋 실측 완료(3축 통합 작업) — current 기반 모드라 과도 조임은
  # 전류 리밋이 막아주므로 각도 범위는 넉넉하게 잡았다.
  joint_limits:
    - [-180.0, 180.0]
    - [-120.0, 120.0]
    - [-120.0, 120.0]
    - [-180.0, 180.0]
    - [-100.0, 100.0]
    - [-180.0, 180.0]   # 그리퍼 — current 기반 모드라 과도 조임은 전류 리밋이 막는다
  homing_speed_deg_per_s: 30.0
  watchdog_timeout_ms: 500

cameras:
  # match_name 으로 지목한다. 정수 인덱스는 USB 를 다시 꽂거나 재부팅하면 밀리지만
  # 장치 이름은 그대로다(arm 의 serial_number 와 같은 역할).
  # 이름이 같은 장치가 여러 대이므로 nth 로 몇 번째인지 고른다(0-based, DirectShow 순서).
  #
  # 내장캠(ACER FHD / ACER IR)은 이름이 'Arducam' 이 아니므로 어떤 슬롯에도
  # 배정되지 않는다 — 인덱스가 어떻게 밀리든 절대 잡히지 않는다.
  #
  # nth 와 실제 카메라의 대응은 `python scripts/find_cameras.py` 로 확인한다.
  # 물리 배치(front/back/left/right/top)와 순서가 다르면 nth 값만 바꿔 맞춘다.
  #
  # fps 15 인 이유는 USB 대역폭이다. 5대 동시 개방 실측(당시 리그, 지금은 4대)(MJPG, 640x480):
  #   30fps → 3/5 대만 열림 (나머지는 open 단계에서 아이소크로너스 대역폭 예약 실패)
  #   15fps → 5/5 대
  # 30fps 로 되돌리려면 카메라를 서로 다른 USB 컨트롤러로 분산해야 한다.
  # 당시에는 5대가 허브 2개(+직결 1)에 몰려 있다.
  #
  # exposure: 가로 줄무늬(조명 플리커 밴딩)가 보이면 각 카메라에 추가한다.
  #   MSMF 기준 log2 초 → -6 = 1/64초, -5 = 1/32초, -4 = 1/16초.
  #   값을 키울수록(-4 방향) 밴딩이 줄지만 밝은 부분이 날아간다.
  #   근본 해결은 DC 구동(무플리커) 조명. 노출 조정은 임시 완화책이다.
  # nth 는 DirectShow 열거 순서상 몇 번째 Arducam 인지를 뜻한다.
  # 순서가 뒤죽박죽인 것은 오타가 아니다 — USB 재배선 후 화면에서 실제 뷰를
  # 보고 맞춘 값이다(2026-08-14). 케이블을 옮기면 다시 틀어질 수 있으니
  # 틀어지면 nth 값만 서로 바꿔 맞춘다.
  # vflip: 거꾸로 매달린 카메라를 상하 반전한다(프리뷰·녹화 모두 적용).
  # view_dir: 3D 재구성용 '물체 → 카메라' 방향 [x, y, z].
  #   +X 오른쪽, +Y 위, +Z 앞(정면). 크기는 무관하다(정규화한다).
  #   실측: 이 값이 실제 배치와 다르면 형상이 물체와 전혀 다르게 나온다.
  #
  # 방위 a·고도 e 로부터: [sin(a)cos(e), sin(e), cos(a)cos(e)]
  #   45°/45° → [0.5, 0.7071, 0.5]      45°/0°  → [0.7071, 0, 0.7071]
  # 함정: 고도 45° 를 [1,1,1] 로 쓰면 실제로는 35.3° 다(정규화하면 y=1/√3).
  #
  # 각도를 바꿨을 때 좋아졌는지는 재구성 결과의 stats.view_dir_consistency 로 본다.
  # 단, 그 값은 큰 오차만 잡아낸다 — 미세 조정의 근거로는 못 쓴다(합성 검증에서
  # 20° 틀린 배치가 정답보다 높은 점수를 받았다). 실제 배치를 재는 게 가장 정확하다.
  # lock_white_balance: 이 Arducam 에서는 false 로 둔다. 자동 WB 를 끄는 순간
  #   드라이버 기본 색온도로 튀어 화면 전체가 초록이 된다(실측 — 수렴 후에 꺼도
  #   '현재 값 고정'이 아니라 기본값 복귀였다). 배경 차분의 색조 드리프트는
  #   reconstruct3d 의 _match_exposure / _saturation_mask 가 보정한다.
  #   white_balance 로 색온도를 지정하는 것도 이 Arducam 은 불가 — DSHOW 에서
  #   WB_TEMPERATURE/TEMPERATURE set 이 거부된다(실측 2026-08-14, 4000~6500K
  #   전 구간 채널비 불변). 캠 간 색감 차이는 자동 WB 의 캠별 수렴 차이며,
  #   하드웨어로는 못 맞춘다. 통일이 꼭 필요하면 소프트웨어 보정을 넣어야 한다.
  #
  # exposure 도 같이 고정해야 배경 참조가 오래간다. 값은 실측으로 정한다:
  #   (대시보드를 끄고) python scripts/find_cameras.py --tune-exposure
  #   출력된 값을 각 줄에 exposure: -5 처럼 추가한다.
  #
  # roi: [x0, y0, x1, y1] (화면 비율, 플립 적용 후) — 3D 검사 때 실루엣을 이 안에서만 뽑는다.
  #   값은 저장된 9세트(classification/{good,defect}/cube + inspections 7개, 2026-10-12)에서
  #   큐브가 놓인 범위의 합집합에 3~5% 여유를 둔 것(2026-10-28). 물체가 멈추는 위치나
  #   카메라 자세가 바뀌면 다시 잡을 것. 리그 캘리브레이션 후에는 줄을 지워도 된다 —
  #   그때는 작업 공간 박스의 투영으로 자동 계산된다.
  cam2: { label: C2 하단 대각 캠 1, match_name: Arducam, nth: 0, vflip: false, lock_white_balance: false, view_dir: [-0.7071, 0.0,   0.7071], roi: [0.31, 0.33, 0.65, 0.76], width: 640, height: 480, fps: 15, fourcc: MJPG, exposure: -6, brightness: -32, power_line_hz: 60, target_mean: 120, contrast: 36, gamma: 90 }  # C2 왼쪽 수평 (방위 -45°, 고도 0°)
  cam3: { label: C3 상단 대각 캠 1, match_name: Arducam, nth: 2, vflip: true, hflip: true, lock_white_balance: false, view_dir: [-0.5,  0.7071, 0.5   ], roi: [0.27, 0.00, 0.76, 0.55], width: 640, height: 480, fps: 15, fourcc: MJPG, exposure: -6, brightness: -32, power_line_hz: 60, target_mean: 120, contrast: 36, gamma: 90 }  # C3 왼쪽 위 대각 (방위 -45°, 고도 +45°)
  cam4: { label: C4 하단 대각 캠 2, match_name: Arducam, nth: 1, vflip: true, lock_white_balance: false, view_dir: [ 0.7071, 0.0,   0.7071], roi: [0.27, 0.43, 0.62, 0.81], width: 640, height: 480, fps: 15, fourcc: MJPG, exposure: -6, brightness: -32, power_line_hz: 60, target_mean: 120, contrast: 36, gamma: 90 }  # C4 오른쪽 수평 (방위 +45°, 고도 0°)
  cam5: { label: C5 상단 대각 캠 2, match_name: Arducam, nth: 3, vflip: true, hflip: true, lock_white_balance: false, view_dir: [ 0.5,  0.7071, 0.5   ], roi: [0.15, 0.24, 0.66, 0.76], width: 640, height: 480, fps: 15, fourcc: MJPG, exposure: -6, brightness: -32, power_line_hz: 60, target_mean: 120, contrast: 36, gamma: 90 }  # C5 오른쪽 위 대각 (방위 +45°, 고도 +45°)

recording:
  root: ./lerobot_data
  # 카메라보다 빠르게 샘플링하면 같은 프레임이 중복 저장되므로 카메라 fps 와 맞춘다.
  # cameras.*.fps 를 30 으로 올린다면 여기도 30 으로 되돌릴 것.
  sample_rate_hz: 15
  max_sync_skew_ms: 15.0
  jpeg_quality: 90
  queue_maxsize: 512

# DC 모터 2축(벨트). 키(feed/work)가 API 경로의 이름이 된다: /api/conveyor/feed/start
# 제어 보드는 STM32F411 BlackPill(DFR0864) 1대 + HW-095(L298N 듀얼 H-브리지) 1개 — 두 항목이 같은 COM
# 포트를 공유하고 motor 번호(M1 = A 채널, M2 = B 채널)로 자기 모터를 지정한다.
# 펌웨어: firmware/conveyor_blackpill/ (빌드 방법·배선은 파일 머리주석 참조)
#   M1 (공급 벨트) : ENA(PWM) PB0(TIM3_CH3), IN1 PA1, IN2 PA2
#                    PA0 은 온보드 KEY 버튼이라 출력으로 쓰지 않는다.
#   M2 (작업 벨트) : ENB(PWM) PA3, IN3 PA6, IN4 PA7
#   모터 전원 12V 는 L298N 12V 단자에 넣고 GND 는 BlackPill 과 공통으로 묶는다.
#   ENA/ENB 점퍼는 반드시 뽑는다 — 꽂혀 있으면 항상 전속이라 PWM 이 안 먹는다.
# 엔코더가 없어 RPM·위치는 모른다. 속도는 PWM 듀티(%)로만 정한다(speed API 의 {"duty": 0~100}).
# 서버가 달리는 벨트가 있는 동안 0.5초마다 PING 을 보내 펌웨어 워치독을 갱신한다 — 서버가 죽으면
# 펌웨어가 HOST_TIMEOUT_MS(기본 2초) 뒤 모든 모터를 세우고, 포트를 닫으면(DTR 하강) 즉시 세운다.
conveyors:
  feed:
    label: 공급 벨트
    port: COM13
    motor: 1
    baudrate: 115200
    timeout_sec: 2.0
    # 선택(0 초과 100 이하, 기본 40). 연결을 새로 연 뒤 첫 START 전에 한 번 펌웨어에 보내는 속도(PWM 듀티 %).
    # 현장 실측 필요: 모터가 실제로 도는 최저 듀티(펌웨어 MIN_RUN_DUTY, 임시값 20)보다 높고 물체가 미끄러지지 않는 값
    default_duty: 40
  work:
    label: 로봇 작업 벨트
    port: COM13
    motor: 2
    baudrate: 115200
    timeout_sec: 2.0
    default_duty: 40   # 현장 실측 필요(위 feed 와 같다)

# 자동 사이클 — 상단 '사이클 시작' 한 번 = 집기 → 벨트 이송 → 5캠 검사 → 분류(양품/불량).
# 아래 값은 전부 출발점이다. '현장 실측 필요' 표시는 실물에서 재서 맞춘다 — 맞추기 전에는 벨트가 물체를
# 엉뚱한 자리에 세울 수 있다. 시작 전 점검(픽 동작 파일·벨트·팔로워·카메라·바스켓)에 걸리면 시작하지 않는다.
# 시간은 전부 초. 이송 거리 = 벨트 속도(belt_duty) × 시간이라 belt_duty 를 바꾸면 아래 시간도 다시 맞춘다.
# 값이 범위를 벗어나면 서버가 뜨지 않는다(벨트 시간 300초·게이트 60초·집기 제한 600초 상한은 ms 로 잘못 적은 값을 거르려는 것).
cycle:
  # 집기: 학습 없이 시연 궤적을 되돌리는 웨이포인트(scripts/to_waypoints.py 산출 JSON). 상대 경로는 레포 루트 기준.
  # 현장 실측 필요: 텔레오퍼로 '집어서 벨트에 놓는' 시연을 녹화 → to_waypoints.py 로 이 경로에 뽑는다.
  pick_waypoints: ./lerobot_data/waypoints/pick_place.json
  # ACT 체크포인트(pretrained_model 폴더). 값을 주면 웨이포인트 대신 이것을 쓴다.
  # 주의: ACT 정책은 '끝났다'는 신호가 없어 집기가 늘 pick_timeout_sec 에 걸려 실패한다 — 값을 주면 사이클 시작이 거부된다(아직 미지원). 웨이포인트를 쓸 것.
  # 현장 실측 필요: 체크포인트를 쓸 때만 경로를 적는다(웨이포인트를 쓰면 null 그대로).
  pick_checkpoint: null
  pick_speed: 1.0              # 웨이포인트 재생 배율. 현장 실측 필요: 처음에는 0.5 쯤으로 낮춰 사람이 지켜보며 올린다
  pick_timeout_sec: 90         # 이 안에 집기가 안 끝나면 실패. 현장 실측 필요: 궤적 길이(/api/rollout/status 의 total_sec)의 2배 안팎
  pick_settle_sec: 1.0         # 집기가 끝난 뒤 벨트를 돌리기 전에 기다리는 시간(0~60). 그리퍼가 물체를 놓는 동작이 끝나게 한다. 현장 실측 필요
  belt: work                   # 물체를 싣는 벨트 키(feed|work). 현장 실측 필요: 실제 배선에서 팔이 물체를 내려놓는 벨트
  belt_dir: cw                 # 사이클을 시작할 때 명시적으로 설정한다. 현장 실측 필요: 검사 자리 쪽으로 가는 방향
  belt_duty: 40                # 벨트 속도(PWM 듀티 %, 0 초과 100 이하). 사이클을 시작할 때 설정한다. 현장 실측 필요: 물체가 미끄러지거나 쏠리지 않는 속도
  to_scan_sec: 3.0             # 집은 물체를 검사 자리까지 옮기는 시간. 현장 실측 필요
  settle_sec: 0.5              # 벨트가 선 뒤 진동이 가라앉기를 기다리는 시간(촬영 전, 0~3). 현장 실측 필요
  resolution: 96               # 3D 복셀 해상도(16~96). 낮추면 판정이 빨라지지만 거칠어진다. 현장 실측 필요: 판정 시간과 형상 거칠기의 균형
  # 표면 이상 정점 비율이 이 값 이상이면 불량. 근거: 깨끗한 큐브는 교란 시험 최악값도 0.47% 이하, 펜 자국은 1.5% 이상(9세트).
  # 현장 실측 필요: 실제 양품 물체로 다시 재면 달라질 수 있다.
  defect_ratio: 0.01
  good_run_sec: 4.0            # 양품: 검사 자리에서 양품 바스켓까지 벨트를 돌리는 시간. 현장 실측 필요
  defect_to_branch_sec: 1.5    # 불량: 검사 자리에서 분기점까지 벨트를 돌리는 시간. 현장 실측 필요
  gate_open_deg: 15            # 분류 게이트(서보 0~180). 레거시 화면의 GATE_OPEN_DEG. 현장 실측 필요
  gate_close_deg: 130          # 레거시 화면의 GATE_CLOSE_DEG. 현장 실측 필요
  gate_hold_sec: 2.0           # 게이트를 연 채 기다리는 시간(물체가 불량 쪽으로 빠지는 시간). 현장 실측 필요
  basket_capacity: 2           # 바스켓 한 개의 용량(개). 제작보고서 플로우차트 값. 현장 실측 필요: 실제 바스켓에 맞춘다
